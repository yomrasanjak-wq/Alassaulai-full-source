name: Unpack ALASSAUL project ZIP
on:
  push:
    paths:
      - 'ALASSAUL-AI-REPAIRED-2026-10-20.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project files into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="ALASSAUL-AI-REPAIRED-2026-10-20.zip"
          test -f "$archive"
          mkdir -p /tmp/alassaul-source
          unzip -q "$archive" -d /tmp/alassaul-source
          source_dir="/tmp/alassaul-source/alassaul_repair"
          test -d "$source_dir"
          # Copy project contents while preserving this workflow and Git metadata.
          rsync -a --exclude='.git/' --exclude='.github/' "$source_dir/" ./
          rm -f "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Import repaired ALASSAUL-AI project files"
            git push
          fi
