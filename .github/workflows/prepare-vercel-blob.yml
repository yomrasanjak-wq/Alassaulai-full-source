name: Prepare Vercel Blob dependency

on:
  push:
    branches:
      - feat/vercel-blob-media-storage
    paths:
      - ".github/workflows/prepare-vercel-blob.yml"

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-blob-media-storage
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add pinned Vercel Blob SDK and refresh lockfile
        run: pnpm add @vercel/blob@2.8.2
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(storage): add Vercel Blob SDK"
          git push origin HEAD:feat/vercel-blob-media-storage
