name: Apply additive ALASSAUL Neon schema migrations

on:
  push:
    branches:
      - feature/control-room-roles
    paths:
      - "drizzle/neon/**"
      - "scripts/migrate-neon.ts"
      - ".github/workflows/migrate-neon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alassaul-neon-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor == 'yomrasanjak-wq'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out migration source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply additive, idempotent schema migrations
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::GitHub secret DATABASE_URL is not configured. No database changes were made."
            exit 1
          fi
          pnpm db:push
