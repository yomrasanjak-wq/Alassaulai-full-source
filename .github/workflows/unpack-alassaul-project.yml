name: Prepare ALASSAUL source import

on:
  push:
    paths:
      - '.github/workflows/unpack-alassaul-project.yml'
      - 'ALASSAUL-AI-REPAIRED-2026-10-20.zip'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract repaired project
        shell: bash
        run: |
          set -euo pipefail
          archive="ALASSAUL-AI-REPAIRED-2026-10-20.zip"
          test -f "$archive"
          mkdir -p /tmp/alassaul-source
          unzip -q "$archive" -d /tmp/alassaul-source
          source_dir="/tmp/alassaul-source/alassaul_repair"
          test -d "$source_dir"
          rsync -a --exclude='.git/' --exclude='.github/' "$source_dir/" ./
          rm -f "$archive"

      - name: Create reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Import repaired ALASSAUL-AI project files"
          title: "Import repaired ALASSAUL-AI project files"
          body: "Automated import of the repaired project ZIP for review. This does not publish or deploy the production site."
          branch: "automation/import-repaired-alassaul-project"
          delete-branch: true
