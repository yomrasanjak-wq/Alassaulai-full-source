name: Verify trusted destinations map entry

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/src/pages/Home.tsx"
      - ".github/workflows/verify-trusted-destinations-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-destinations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Build application
        run: pnpm run build
