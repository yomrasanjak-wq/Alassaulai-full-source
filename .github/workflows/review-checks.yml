name: ALASSAUL-AI review checks

on:
  push:
    branches:
      - "migration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: alassaul-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: AI configuration preflight tests
        run: pnpm brain:preflight:test
      - name: Application tests
        run: pnpm test
      - name: Production build verification
        run: pnpm build
